name: Tests

# Static checks + browser tests on every push and pull request.
# Browser tests run against the STAGING Supabase project (never the live one).
# Not yet run on GitHub: the first run may need small fixes.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed so the static check can compare with the previous commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks (version numbers, pre-cache list, manifest, version bump)
        run: node tests/static-checks.js
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Install browser test tools
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: tests
        run: |
          node environment.test.js
          node baseline.test.js
          node auth.test.js
          node terminal.test.js
          node photos.test.js
          node update.test.js
          node smoke.test.js

  database:
    # Database security rules (supabase/migrations) tested on a throw-away Postgres: tests/db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Database security tests
        run: bash tests/db/run.sh
